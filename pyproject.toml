[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "screenpad"
version = "0.1.0"
description = "Screen-replay presentation attack detection for face images"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jamie Swaine" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm>=4.65",
    "huggingface_hub>=0.24",
    "threadpoolctl>=3.7.0",
    "pillow-heif>=1.0",
]

[project.optional-dependencies]
# Colab already ships torch/torchvision, so notebooks install `.[torch]` without re-downloading them.
torch = ["torch>=2.3", "torchvision>=0.18", "timm>=1.0"]
# EfficientAD through its published implementation (Apache-2.0); installed only where that member is trained or scored.
anomaly = ["anomalib==2.6.1"]

[project.scripts]
screenpad = "screenpad.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "seaborn>=0.13",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "mlflow>=2.14",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-argparse>=0.6.1",
]

[tool.setuptools.packages.find]
include = ["screenpad*"]

[tool.setuptools.package-data]
screenpad = ["assets/*.onnx", "assets/LICENSE-*"]

# On Linux (the Docker image) pull CPU-only torch wheels, which are ~10x smaller than the
# default CUDA ones. macOS wheels from PyPI are already CPU/MPS-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
