ensemble:
  # Members are independent and switchable: `enabled` decides what the shipped ensemble averages; the ablation
  # scores every coalition of all members listed here (enabled or not). See screenpad/ensemble/core.py.
  roots: {runs: results/sweep/hub/runs, oneclass: results/oneclass}
  dir: ensemble  # outputs under results/<dir>/ (a variant system uses its own, e.g. configs/ensemble_photo.yaml)
  members:
    A: {enabled: true, type: run, runs: [A_dinov2b_loose224_s42, A_dinov2b_loose224_s43, A_dinov2b_loose224_s44]}
    B: {enabled: false, type: run, runs: [B_dinov2b_tight224_s42, B_dinov2b_tight224_s43, B_dinov2b_tight224_s44]}
    C: {enabled: true, type: run, runs: [C_dinov2b_loose392_s42, C_dinov2b_loose392_s43, C_dinov2b_loose392_s44]}
    D: {enabled: false, type: run, runs: [D_clip_loose224_s42, D_clip_loose224_s43, D_clip_loose224_s44]}
    E: {enabled: false, type: run, runs: [E_convnext_loose384_s42, E_convnext_loose384_s43, E_convnext_loose384_s44]}
    # One-class members (fitted on bona fide only). `path`: folder under roots.oneclass; `hf_run`: run folder on the HF runs repo (for fetch-models).
    # Chosen on synthetic val only (the up-front block-8 choice scored at chance); see screenpad/oneclass/models.py.
    patchcore_ftA: {enabled: true, type: oneclass, path: patchcore_loose224_ftA, hf_run: pc_loose224_b8_ftA}  # features of fine-tuned A (block 8): synthetic val 0.96
    patchcore: {enabled: false, type: oneclass, path: patchcore_loose224, hf_run: patchcore_loose224}  # pretrained DINOv2 block 8, 10% coreset: 0.55
    patchcore_392b5: {enabled: false, type: oneclass, path: patchcore_loose392_b5, hf_run: pc_loose392_b5}  # best pretrained-DINOv2 variant: 0.73
    patchcore_392b3: {enabled: false, type: oneclass, path: patchcore_loose392_b3, hf_run: pc_loose392_b3}
    patchcore_224b5: {enabled: false, type: oneclass, path: patchcore_loose224_b5, hf_run: pc_loose224_b5}
    # Independent candidates (never see an attack or the simulator), synthetic val AUC; inclusion bar 0.80, none clears it:
    patchcore_dinov2l_b10: {enabled: false, type: oneclass, path: patchcore_loose392_dinov2_l_b10, hf_run: pc_loose392_dinov2l_b10}  # 0.75
    patchcore_ssl_392b5: {enabled: false, type: oneclass, path: patchcore_loose392_b5_ftssl, hf_run: pc_loose392_b5_ssl}  # self-supervised bona fide adaptation: 0.74
    patchcore_ssl_224b8: {enabled: false, type: oneclass, path: patchcore_loose224_ftssl, hf_run: pc_loose224_b8_ssl}  # 0.57
    efficientad: {enabled: false, type: oneclass, path: efficientad_loose256, hf_run: ead_loose256}  # anomalib EfficientAD-S, A100: 0.58; not scorable by the frozen scorer
    patchcore_wrn50_224: {enabled: false, type: oneclass, path: patchcore_loose224_wrn50, hf_run: pc_loose224_wrn50}  # 0.50
    patchcore_dinov2l_b6: {enabled: false, type: oneclass, path: patchcore_loose392_dinov2_l_b6, hf_run: pc_loose392_dinov2l_b6}  # 0.67
    patchcore_wrn50_392: {enabled: false, type: oneclass, path: patchcore_loose392_wrn50, hf_run: pc_loose392_wrn50}  # 0.53; landed after the freeze, does not affect it
    mahalanobis: {enabled: false, type: oneclass, path: mahalanobis_loose224}  # dev AUC 0.67 [0.43, 0.87]: no reliable signal; no saved model, not scorable
    F: {enabled: false, type: run, runs: [F_dinov2b_loose224_porig50_s42, F_dinov2b_loose224_porig50_s43, F_dinov2b_loose224_porig50_s44]}
    G: {enabled: false, type: run, runs: [G_dinov2b_loose224_porig0_s42, G_dinov2b_loose224_porig0_s43, G_dinov2b_loose224_porig0_s44]}
  # family: mean of the two-class family and the one-class family, so the one-class side keeps half the decision
  # however many classifiers are enabled (mean = every member equal; max = flag if either family flags).
  # Coalition ablation over these members (2^11 - 1 = 2047 coalitions); every member is also reported on its own.
  ablation_members: [A, B, C, D, E, F, G, patchcore_ftA, patchcore, patchcore_dinov2l_b10, efficientad]
  # Both rules are reported (ablation_family.csv, ablation_mean.csv). Default = the better on dev: by member. With PatchCore-ftA
  # the family rule missed one dev attack (10741) at the threshold; per-member caught all 6. Dev-informed; disclosed.
  combine: mean
  # Operating point (tunable: --set ensemble.bpcer_target=0.05), security-first default for a financial setting: reject this fraction of calibration bona fide
  # (val originals + camera-only). Set on bona fide only, before test. At 0.05 one of the 6 dev attacks (10741) passed.
  bpcer_target: 0.10
