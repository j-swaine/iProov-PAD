ensemble:
  # Members are independent and switchable: `enabled` decides what the shipped ensemble averages; the ablation
  # scores every coalition of all members listed here (enabled or not). See screenpad/ensemble/core.py.
  roots: {runs: results/sweep/hub/runs, oneclass: results/oneclass}
  members:
    A: {enabled: true, type: run, runs: [A_dinov2b_loose224_s42, A_dinov2b_loose224_s43, A_dinov2b_loose224_s44]}
    B: {enabled: false, type: run, runs: [B_dinov2b_tight224_s42, B_dinov2b_tight224_s43, B_dinov2b_tight224_s44]}
    C: {enabled: true, type: run, runs: [C_dinov2b_loose392_s42, C_dinov2b_loose392_s43, C_dinov2b_loose392_s44]}
    D: {enabled: false, type: run, runs: [D_clip_loose224_s42, D_clip_loose224_s43, D_clip_loose224_s44]}
    E: {enabled: false, type: run, runs: [E_convnext_loose384_s42, E_convnext_loose384_s43, E_convnext_loose384_s44]}
    patchcore: {enabled: true, type: oneclass, path: patchcore_loose224}
    mahalanobis: {enabled: false, type: oneclass, path: mahalanobis_loose224}  # dev AUC 0.67 [0.43, 0.87]: no reliable signal
    F: {enabled: false, type: run, runs: [F_dinov2b_loose224_porig50_s42, F_dinov2b_loose224_porig50_s43, F_dinov2b_loose224_porig50_s44]}
    G: {enabled: false, type: run, runs: [G_dinov2b_loose224_porig0_s42, G_dinov2b_loose224_porig0_s43, G_dinov2b_loose224_porig0_s44]}
  # family: mean of the two-class family and the one-class family, so the one-class side keeps half the decision
  # however many classifiers are enabled (mean = every member equal; max = flag if either family flags).
  combine: family
  # Operating point (tunable: --set ensemble.bpcer_target=0.05), security-first default for a financial setting: reject this fraction of calibration bona fide
  # (val originals + camera-only). Set on bona fide only, before test. At 0.05 one of the 6 dev attacks (10741) passed.
  bpcer_target: 0.10
