# C's recipe + the same photometric robustness augmentation as H (see H_dinov2b_loose224_photo.yaml).
train:
  {backbone: dinov2_b, crop: loose, input_size: 392, batch_size: 48, epochs: 20,
   augment: {brightness: 0.4, p_blur: 0.3, max_blur: 2.0, p_gamma: 0.3, max_gamma: 1.5, p_noise: 0.3, max_noise: 0.031}}
